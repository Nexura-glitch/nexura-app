<html lang="es">
<head>
<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexura Admin — Usuarios</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCIgZmlsbD0ibm9uZSI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSI0IiB5MT0iNiIgeDI9IjQ0IiB5Mj0iNDIiIGdyYWRpZW50VW5pdHM9InVzZXJTcGFjZU9uVXNlIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjZjBjMTdlIi8+CiAgICAgIDxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iI2M5NzkzYyIvPgogICAgPC9saW5lYXJHcmFkaWVudD4KICA8L2RlZnM+CiAgPHJlY3Qgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiByeD0iMTIiIGZpbGw9InVybCgjZykiLz4KICA8cGF0aCBkPSJNMTUgMzRWMTQuNmMwLS45IDEuMDgtMS4zNiAxLjczLS43M0wzMiAyOC43VjE0IiBzdHJva2U9IiMxNDE2MWEiIHN0cm9rZS13aWR0aD0iMy42IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGZpbGw9Im5vbmUiLz4KPC9zdmc+Cg==" />
</head>
<body>

<div class="app-shell">
  <nav class="sidebar" id="shell-sidebar"></nav>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Usuarios</h1>
        <div class="subtitle">Modifique saldos, información y nivel de verificación de cada cliente.</div>
      </div>
      <div class="topbar-actions" id="shell-topbar-right"></div>
    </div>

    <div class="card card-pad reveal">
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Buscar nombre, correo…" />
        </div>
        <button class="btn btn-primary" id="new-user-btn">+ Nuevo Usuario</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Saldo</th>
              <th>Verificación</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <div id="empty-host"></div>
    </div>
  </main>
</div>

<!-- Edit / manage modal -->
<div class="modal-backdrop" id="edit-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h3>Gestionar Cliente</h3>
      <button class="modal-close" id="close-edit">&times;</button>
    </div>

    <div class="field">
      <label>Nombre</label>
      <input type="text" id="f-name" />
    </div>
    <div class="field">
      <label>Correo Electrónico</label>
      <input type="email" id="f-email" />
    </div>
    <div class="field-row">
      <div class="field">
        <label>Saldo Disponible ($)</label>
        <input type="number" step="0.01" id="f-balance" />
      </div>
      <div class="field">
        <label>Saldo Restante ($)</label>
        <input type="number" step="0.01" id="f-available" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Nivel de Verificación</label>
        <select id="f-verif">
          <option value="Pendiente">Pendiente</option>
          <option value="En Revisión">En Revisión</option>
          <option value="Verificado">Verificado</option>
        </select>
      </div>
      <div class="field">
        <label>Estado de la Cuenta</label>
        <select id="f-status">
          <option value="Activa">Activa</option>
          <option value="En Revisión">En Revisión</option>
          <option value="Suspendida">Suspendida</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Teléfono</label>
        <input type="text" id="f-phone" />
      </div>
      <div class="field">
        <label>Dirección</label>
        <input type="text" id="f-address" />
      </div>
    </div>

    <button class="btn btn-primary btn-block" id="save-user-btn">Guardar Cambios</button>

    <div style="border-top:1px solid var(--line); margin:20px 0 16px;"></div>

    <div class="section-title" style="margin-bottom:10px;"><h2 style="font-size:13.5px;">Agregar / Retirar Fondos</h2></div>
    <div class="field-row">
      <div class="field">
        <label>Monto ($)</label>
        <input type="number" step="0.01" id="f-fund-amount" placeholder="Ej. 200" />
      </div>
      <div class="field" style="justify-content:flex-end;">
        <div style="display:flex; gap:8px;">
          <button class="btn btn-secondary" style="flex:1;" id="add-fund-btn">+ Agregar</button>
          <button class="btn btn-danger" style="flex:1;" id="remove-fund-btn">− Retirar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- New user modal -->
<div class="modal-backdrop" id="new-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h3>Nuevo Usuario</h3>
      <button class="modal-close" id="close-new">&times;</button>
    </div>
    <div class="field"><label>Nombre Completo</label><input type="text" id="n-name" /></div>
    <div class="field"><label>Correo Electrónico</label><input type="email" id="n-email" /></div>
    <div class="field"><label>Número de Cuenta</label><input type="text" id="n-account" placeholder="Ej. 0021 4487 9012" /></div>
    <div class="field-row">
      <div class="field"><label>Saldo Inicial ($)</label><input type="number" step="0.01" id="n-balance" value="0" /></div>
      <div class="field"><label>Saldo Restante ($)</label><input type="number" step="0.01" id="n-available" value="0" /></div>
    </div>
    <button class="btn btn-primary btn-block" id="create-user-btn">Crear Cuenta</button>
  </div>
</div>

<script src="../js/data-service.js"></script>
<script src="../js/shell.js"></script>
<script>
let users = [];
let editingId = null;

async function main() {
  const ok = await Shell.requireAdminSession();
  if (!ok) return;
  await AdminShell.renderAdminShell("users");

  users = await DataService.getUsers();
  render();

  document.getElementById("search-input").addEventListener("input", render);
  document.getElementById("close-edit").addEventListener("click", () => toggleModal("edit-backdrop", false));
  document.getElementById("edit-backdrop").addEventListener("click", (e) => { if (e.target.id === "edit-backdrop") toggleModal("edit-backdrop", false); });
  document.getElementById("save-user-btn").addEventListener("click", saveUser);
  document.getElementById("add-fund-btn").addEventListener("click", () => adjustFund(1));
  document.getElementById("remove-fund-btn").addEventListener("click", () => adjustFund(-1));

  document.getElementById("new-user-btn").addEventListener("click", () => toggleModal("new-backdrop", true));
  document.getElementById("close-new").addEventListener("click", () => toggleModal("new-backdrop", false));
  document.getElementById("new-backdrop").addEventListener("click", (e) => { if (e.target.id === "new-backdrop") toggleModal("new-backdrop", false); });
  document.getElementById("create-user-btn").addEventListener("click", createUser);
}

function toggleModal(id, open) {
  document.getElementById(id).classList.toggle("open", open);
}

function render() {
  const q = document.getElementById("search-input").value.trim().toLowerCase();
  const rows = users.filter(u => !q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));
  const tbody = document.getElementById("table-body");
  const emptyHost = document.getElementById("empty-host");

  if (rows.length === 0) {
    tbody.innerHTML = "";
    emptyHost.innerHTML = `<div class="empty-state"><h3>Sin resultados</h3><p>Ajuste su búsqueda.</p></div>`;
    return;
  }
  emptyHost.innerHTML = "";

  tbody.innerHTML = rows.map(u => `
    <tr>
      <td>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="avatar" style="width:32px;height:32px;font-size:11px;">${Shell.initials(u.name)}</div>
          <div>
            <div style="font-weight:500;">${u.name}</div>
            <div style="font-size:11.5px; color:var(--text-low);">${u.email}</div>
          </div>
        </div>
      </td>
      <td class="num">${Shell.fmtUSD(u.balance)}</td>
      <td><span class="verif-badge ${u.verificationLevel === "Verificado" ? "ok" : "pending"}">${u.verificationLevel || "Pendiente"}</span></td>
      <td><span class="status-pill ${u.accountStatus === "Suspendida" ? "rejected" : "completed"}">${u.accountStatus || "Activa"}</span></td>
      <td>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-ghost" data-id="${u.id}" style="padding:7px 12px; font-size:12.5px;">Gestionar</button>
          <button class="btn ${u.accountStatus === "Suspendida" ? "btn-secondary" : "btn-danger"}" data-suspend="${u.id}" style="padding:7px 12px; font-size:12.5px;">${u.accountStatus === "Suspendida" ? "Reactivar" : "Suspender"}</button>
        </div>
      </td>
    </tr>
  `).join("");

  tbody.querySelectorAll("button[data-id]").forEach(btn => {
    btn.addEventListener("click", () => openEdit(btn.dataset.id));
  });
  tbody.querySelectorAll("button[data-suspend]").forEach(btn => {
    btn.addEventListener("click", () => quickToggleSuspend(btn.dataset.suspend));
  });
}

async function quickToggleSuspend(id) {
  const u = users.find(x => x.id === id);
  if (!u) return;
  const nextStatus = u.accountStatus === "Suspendida" ? "Activa" : "Suspendida";
  await DataService.updateUser(id, { accountStatus: nextStatus });
  await DataService.addNotification({
    userId: id,
    type: "account",
    title: nextStatus === "Suspendida" ? "Cuenta suspendida" : "Cuenta reactivada",
    message: nextStatus === "Suspendida"
      ? "Su cuenta ha sido suspendida temporalmente por la administración."
      : "Su cuenta ha sido reactivada. Ya puede operar normalmente.",
  });
  users = await DataService.getUsers();
  render();
  Shell.toast(nextStatus === "Suspendida" ? "Cliente suspendido" : "Cliente reactivado");
}

function openEdit(id) {
  const u = users.find(x => x.id === id);
  if (!u) return;
  editingId = id;
  document.getElementById("f-name").value = u.name;
  document.getElementById("f-email").value = u.email;
  document.getElementById("f-balance").value = u.balance;
  document.getElementById("f-available").value = u.available;
  document.getElementById("f-verif").value = u.verificationLevel || "Pendiente";
  document.getElementById("f-status").value = u.accountStatus || "Activa";
  document.getElementById("f-phone").value = u.phone || "";
  document.getElementById("f-address").value = u.address || "";
  document.getElementById("f-fund-amount").value = "";
  toggleModal("edit-backdrop", true);
}

async function saveUser() {
  if (!editingId) return;
  const fields = {
    name: document.getElementById("f-name").value.trim(),
    email: document.getElementById("f-email").value.trim(),
    balance: parseFloat(document.getElementById("f-balance").value) || 0,
    available: parseFloat(document.getElementById("f-available").value) || 0,
    verificationLevel: document.getElementById("f-verif").value,
    accountStatus: document.getElementById("f-status").value,
    phone: document.getElementById("f-phone").value.trim(),
    address: document.getElementById("f-address").value.trim(),
  };
  fields.initials = Shell.initials(fields.name);
  await DataService.updateUser(editingId, fields);
  await DataService.addNotification({
    userId: editingId,
    type: "account",
    title: "Cuenta actualizada",
    message: "La información de su cuenta fue actualizada por la administración.",
  });
  users = await DataService.getUsers();
  render();
  toggleModal("edit-backdrop", false);
  Shell.toast("Cliente actualizado");
}

async function adjustFund(sign) {
  if (!editingId) return;
  const amount = parseFloat(document.getElementById("f-fund-amount").value);
  if (!amount || amount <= 0) { Shell.toast("Indique un monto válido", "error"); return; }
  const delta = sign * amount;
  await DataService.adjustFunds(editingId, delta);
  await DataService.addTransaction({
    userId: editingId,
    type: delta > 0 ? "credit" : "debit",
    label: delta > 0 ? "Crédito agregado por la administración" : "Débito aplicado por la administración",
    category: "Ajuste",
    amount: Math.abs(delta),
    status: "completed",
  });
  await DataService.addNotification({
    userId: editingId,
    type: "transaction",
    title: delta > 0 ? "Fondos agregados" : "Fondos retirados",
    message: `Se ${delta > 0 ? "acreditó" : "debitó"} un monto de ${Shell.fmtUSD(Math.abs(delta))} en su cuenta.`,
  });
  users = await DataService.getUsers();
  render();
  openEdit(editingId);
  Shell.toast(delta > 0 ? "Fondos agregados" : "Fondos retirados");
}

async function createUser() {
  const name = document.getElementById("n-name").value.trim();
  const email = document.getElementById("n-email").value.trim();
  const accountNumber = document.getElementById("n-account").value.trim();
  const balance = parseFloat(document.getElementById("n-balance").value) || 0;
  const available = parseFloat(document.getElementById("n-available").value) || 0;
  if (!name || !email) { Shell.toast("Nombre y correo son obligatorios", "error"); return; }

  await DataService.createUser({ name, email, accountNumber, balance, available });
  users = await DataService.getUsers();
  render();
  toggleModal("new-backdrop", false);
  ["n-name", "n-email", "n-account"].forEach(id => document.getElementById(id).value = "");
  Shell.toast("Usuario creado");
}

main();
</script>
</body>
</html>
